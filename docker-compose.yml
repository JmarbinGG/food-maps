services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: food_maps
      MYSQL_USER: foodmaps
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: password
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ppassword"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=mysql+pymysql://foodmaps:password@mysql:3306/food_maps
      - PUBLIC_BASE_URL=http://localhost:8000
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - ./frontend:/app/frontend
      # User-uploaded photos. uploads/ is gitignored and excluded from the
      # image, so it needs its own volume or listing photos and chat
      # attachments disappear on every rebuild.
      - ./uploads:/app/uploads
    command: uvicorn backend.app:app --host 0.0.0.0 --port 8000 --reload

volumes:
  mysql_data:
