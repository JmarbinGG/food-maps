services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: food_maps
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/food_maps
      - PUBLIC_BASE_URL=http://localhost:8000
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # The app serves the frontend HTML/JS from the repo root, so the whole
      # project is mounted rather than just backend/.
      - .:/app
    command: uvicorn backend.app:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
