# Response headers applied at server level. nginx does not merge add_header
# across block levels: if any location in these configs grows its own
# add_header, it must re-include this file or these are silently dropped.

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Cross-Origin-Opener-Policy same-origin always;

# No Content-Security-Policy yet, and adding one is not a drop-in change. The
# frontend loads React, Babel standalone, Tailwind and Mapbox from CDNs and
# relies on inline <script> blocks plus in-browser JSX compilation, so any
# policy without 'unsafe-inline' and 'unsafe-eval' blanks the app. Introduce it
# in report-only mode first:
#
# add_header Content-Security-Policy-Report-Only "default-src 'self'; \
#     script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com https://cdn.jsdelivr.net https://api.mapbox.com; \
#     style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://api.mapbox.com; \
#     img-src 'self' data: blob: https:; \
#     connect-src 'self' https://api.mapbox.com https://events.mapbox.com; \
#     worker-src 'self' blob:" always;
