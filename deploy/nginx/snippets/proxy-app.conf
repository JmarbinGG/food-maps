# Shared upstream settings. Included from every location that forwards to the
# FastAPI container. Requires a `map ... $connection_upgrade` in http context;
# each server config in this directory declares one.

# Docker's embedded DNS server, plus a variable in proxy_pass. Both halves
# matter: with a literal `proxy_pass http://api:8000`, nginx resolves the name
# once while loading its configuration and caches that address indefinitely.
# Recreating the api container — which every deploy does — hands it a new
# address on the bridge network, and nginx keeps proxying to the old one,
# returning 502 until someone reloads it. Routing through a variable defers
# resolution to request time so a redeploy heals itself within `valid`.
resolver 127.0.0.11 valid=10s ipv6=off;
set $foodmaps_upstream api:8000;

proxy_pass http://$foodmaps_upstream;
proxy_http_version 1.1;

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;

proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $connection_upgrade;

proxy_connect_timeout 5s;
proxy_send_timeout    120s;
# The assistant endpoints call OpenAI inline — chat with tool calls, Whisper
# transcription, TTS — and routinely outlast nginx's 60s default.
proxy_read_timeout    120s;

proxy_redirect off;
